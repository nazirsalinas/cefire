<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Columna vertebral anatómica con vértebras interconectadas -->
  <path d="M32 10 L32 54" stroke-width="2" stroke-dasharray="3 3" />
  <!-- Vértebra 1 -->
  <rect x="24" y="12" width="16" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.2" />
  <!-- Vértebra 2 -->
  <rect x="22" y="21" width="20" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3" />
  <!-- Vértebra 3 (central) -->
  <rect x="20" y="30" width="24" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.4" />
  <!-- Vértebra 4 -->
  <rect x="22" y="40" width="20" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.3" />
  <!-- Vértebra 5 -->
  <rect x="24" y="49" width="16" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.2" />
  <!-- Destellos de reactivación nerviosa lateral -->
  <path d="M14 26 L8 30 L14 34" stroke-width="2.2" />
  <path d="M50 26 L56 30 L50 34" stroke-width="2.2" />
</svg>
